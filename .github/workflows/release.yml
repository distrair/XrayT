name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag for release (e.g. v1.0.1). Leave blank to auto-generate from build number.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute App Version
        id: version
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building with Version Name: ${TAG}, Version Code: ${{ github.run_number }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download latest libXray.aar
        id: libxray
        run: |
          mkdir -p app/libs
          XRAY_TAG=$(curl -sIL https://github.com/XTLS/libXray/releases/latest | grep -i '^location:' | head -n1 | sed 's/.*\///' | tr -d '\r\n')
          if [ -z "$XRAY_TAG" ]; then
            XRAY_TAG=$(curl -sSL -H "User-Agent: GitHubActions" https://api.github.com/repos/XTLS/libXray/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -n1 | cut -d'"' -f4)
          fi
          echo "xray_tag=${XRAY_TAG:-latest}" >> $GITHUB_OUTPUT
          echo "Bundling libXray: ${XRAY_TAG:-latest}"

          curl -sSL -o libxray.zip https://github.com/XTLS/libXray/releases/latest/download/libxray-android.zip
          unzip -j libxray.zip "*/libXray.aar" -d app/libs/
          rm -f libxray.zip
          ls -lh app/libs/

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 repository secret before running a release build."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/xrayt-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ steps.version.outputs.tag }}

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk XrayT-${{ steps.version.outputs.tag }}.apk
          ls -lh XrayT-*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XrayT-${{ steps.version.outputs.tag }}
          path: XrayT-${{ steps.version.outputs.tag }}.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ### Automated Release `${{ steps.version.outputs.tag }}`
            - **Bundled libXray core**: `${{ steps.libxray.outputs.xray_tag }}`
            - **Build number (versionCode)**: `${{ github.run_number }}`
          files: |
            XrayT-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
