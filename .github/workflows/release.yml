name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download libXray.aar
        run: |
          mkdir -p app/libs
          curl -sSL -o libxray.zip https://github.com/XTLS/libXray/releases/latest/download/libxray-android.zip
          unzip -j libxray.zip "*/libXray.aar" -d app/libs/
          rm -f libxray.zip
          ls -lh app/libs/

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk XrayT-release.apk
          ls -lh XrayT-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XrayT-release-apk
          path: XrayT-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: XrayT-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
